[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vieneu-tts-service"
version = "2.0.0"
description = "VieNeu-TTS Distributed Engine & Subtitle Sync Service (HTTP + gRPC)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "grpcio>=1.65.0",
    "grpcio-health-checking>=1.65.0",
    "grpcio-reflection>=1.65.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "ffsubsync>=0.4.25",
    "vieneu>=3.8.0",
]

[project.optional-dependencies]
cuda = [
    "vieneu[cuda]>=3.8.0",
]
dev = [
    "grpcio-tools>=1.65.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
tts-service = "tts_service.main:main"
vieneu-tts-service = "tts_service.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["src/tts_service/transport/grpc/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
